    <!-- The site is shown in Turkish only (the English posts are unpublished).
         Elements with class lang-tr / lang-en are shown only in their language. -->
    <style>
        html[data-lang="tr"] .lang-en, html[data-lang="en"] .lang-tr { display: none !important; }
    </style>
    <script>document.documentElement.setAttribute('data-lang', '{{ site.default_lang }}');</script>
