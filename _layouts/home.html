---
layout: compress
---
<!DOCTYPE html>
<!--[if lt IE 7]><html class="no-js lt-ie9 lt-ie8 lt-ie7"> <![endif]-->
<!--[if (IE 7)&!(IEMobile)]><html class="no-js lt-ie9 lt-ie8"><![endif]-->
<!--[if (IE 8)&!(IEMobile)]><html class="no-js lt-ie9"><![endif]-->
<!--[if gt IE 8]><!--> <html class="no-js"><!--<![endif]-->
<head>
    {% include head.html %}
</head>
<body>
    {% include nav.html %}
    <!-- Header -->
    <header class="header flex" role="banner">
        <div class="container animated fadeIn">
            <div class="row">
                    <a href="{{ site.url }}">
                        <img src="{{ site.logo }}" class="img-circle zoombtn animated rotateIn">
                    </a>
                    <h3 class="title">
                        <a class="zoombtn" href="{{ site.url }}">
                        	<p style="font-size:1.2rem;font-weight:300">{{ site.title }}</p>
			            </a>
                    </h3>
                    <hr class="hr-line">
                    <h3 class="title">
                        <a href="{{ site.url }}">
                        	<p style="font-size:1rem;font-weight:300">{{ site.bio }}</p>
			            </a>
                    </h3>
                    {% include social-links.html %}
                  <hr class="hr-line">
                  <h3 class="title">
                         <a class="btn zoombtn lang-tr" href="{{ site.url }}/about/">Hakkında</a>
                         <a class="btn zoombtn lang-en" href="{{ site.url }}/about-en/">About</a>
                         <a class="btn zoombtn" href="{{ site.url }}/posts/"><span class="lang-tr">Yazılar</span><span class="lang-en">Posts</span></a>
                         <a class="btn zoombtn" href="{{ site.url }}/projects/"><span class="lang-tr">Projeler</span><span class="lang-en">Projects</span></a>
                 </h3>
                 <div class="lang-choice">
                         <a href="#" class="lang-option" data-choice="tr" onclick="setLanguage('tr'); return false;">Türkçe</a>
                         <a href="#" class="lang-option" data-choice="en" onclick="setLanguage('en'); return false;">English</a>
                 </div>
            </div>
        </div>
    </header>
    {% include scripts.html %}
</body>
</html>
